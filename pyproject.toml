[project]
name = "powerlifting-predictor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.136.3",
    "joblib==1.5.2",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "scikit-learn==1.7.2",
    "scipy==1.16.2",
    "uvicorn==0.49.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib==3.10.6",
    "openpyxl==3.1.5",
    "seaborn==0.13.2",
]

[tool.uv]
python-preference = "only-managed"